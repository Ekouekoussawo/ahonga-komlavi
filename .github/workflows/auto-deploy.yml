# Auto-deploy workflow for GitHub Actions
# Triggers on: git push to main, or manual trigger, or 30-minute schedule
# Deploys Next.js frontend to HostGator automatically

name: Auto-deploy Next.js site

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/auto-deploy.yml'
  schedule:
    # Fallback: run every 30 minutes
    - cron: '*/30 * * * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:
  # Webhook trigger from WordPress (trigger-rebuild.php mu-plugin)
  repository_dispatch:
    types: [wp-post-published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HG_HOST: gator3223.hostgator.com
      HG_USER: zank
      HG_REMOTE_PATH: /home4/zank/evangelisteahongankomlavi.com
      HG_MYSQL_USER: zank_ahonga
      HG_MYSQL_DB: zank_ahonga
      HG_TABLE_PREFIX: wp_

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Setup SSH (sshpass + known_hosts)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          ssh-keyscan -H $HG_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Dump WordPress database from HostGator
        env:
          HG_PASS: ${{ secrets.HG_PASS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Dumping WordPress database from HostGator..."
          # Dump wp_posts and wp_postmeta tables (needed for featured images via _thumbnail_id and _wp_attached_file)
          # Output goes to app/sql/local.sql which the prebuild script (snapshot-wp-content.mjs) reads
          mkdir -p app/sql
          sshpass -p "$HG_PASS" ssh -o StrictHostKeyChecking=no \
            $HG_USER@$HG_HOST \
            "mysqldump -u $HG_MYSQL_USER -p'$DB_PASSWORD' $HG_MYSQL_DB ${HG_TABLE_PREFIX}posts ${HG_TABLE_PREFIX}postmeta ${HG_TABLE_PREFIX}terms ${HG_TABLE_PREFIX}term_taxonomy ${HG_TABLE_PREFIX}term_relationships" \
            > app/sql/local.sql 2>/dev/null || echo "WARNING: MySQL dump failed, will use WordPress REST API or existing local.sql in prebuild"

      - name: Generate snapshot
        working-directory: ./frontend
        run: |
          echo "Snapshot will be generated by prebuild hook (scripts/snapshot-wp-content.mjs)"
          echo "It fetches from WordPress REST API, or falls back to app/sql/local.sql, or preserves existing snapshot."

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to HostGator (preserve WordPress core)
        working-directory: ./frontend
        env:
          HG_PASS: ${{ secrets.HG_PASS }}
        run: |
          # Deploy the built static files to HostGator via SSH
          echo "Deploying static files to HostGator..."
          sshpass -p "$HG_PASS" ssh -o StrictHostKeyChecking=no \
            $HG_USER@$HG_HOST \
            "cd $HG_REMOTE_PATH && \
             echo 'Cleaning old static files (preserving WordPress core)...' && \
             find . -maxdepth 1 -type f ! -name '.htaccess' ! -name 'index.php' ! -name 'wp-config.php' ! -name 'wp-*.php' ! -name 'php*.php' ! -name 'xmlrpc.php' -delete 2>/dev/null; \
             find . -maxdepth 1 -type d ! -name '.' ! -name '..' ! -name '.*' ! -name 'wp' ! -name 'wp-content' ! -name 'wp-includes' ! -name 'wp-admin' ! -name 'wp-*' -exec rm -rf {} + 2>/dev/null || true"

          # Upload new files (exclude WordPress directories)
          rsync -avz --delete \
            --exclude 'wp/' \
            --exclude 'wp-content/' \
            --exclude 'wp-includes/' \
            --exclude 'wp-admin/' \
            -e "sshpass -p '$HG_PASS' ssh -o StrictHostKeyChecking=no" \
            out/ $HG_USER@$HG_HOST:$HG_REMOTE_PATH/

      - name: Verify deployment
        run: |
          curl -s -o /dev/null -w "Homepage: %{http_code}\n" https://evangelisteahongankomlavi.com/
          curl -s -o /dev/null -w "Sermons: %{http_code}\n" https://evangelisteahongankomlavi.com/sermons/
          curl -s -o /dev/null -w "Snapshot: %{http_code}\n" https://evangelisteahongankomlavi.com/_generated/wp-content.json
