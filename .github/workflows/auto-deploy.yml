# Auto-deploy workflow for GitHub Actions
# Triggers on: git push to main, or manual trigger, or 30-minute schedule
# Deploys Next.js frontend to HostGator automatically

name: Auto-deploy Next.js site

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/auto-deploy.yml'
  schedule:
    # Fallback: run every 30 minutes
    - cron: '*/30 * * * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:
  # Webhook trigger from WordPress
  repository_dispatch:
    types: [wordpress-post-published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HG_HOST: gator3223.hostgator.com
      HG_USER: zank
      HG_REMOTE_PATH: /home4/zank/evangelisteahongankomlavi.com
      HG_MYSQL_USER: zank_ahonga
      HG_MYSQL_DB: zank_ahonga

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Setup SSH (sshpass + known_hosts)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          ssh-keyscan -H $HG_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Dump posts from HostGator MySQL
        working-directory: ./frontend
        env:
          HG_PASS: ${{ secrets.HG_PASS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p public/_generated
          echo "Dumping posts from HostGator..."
          DUMP_CMD="SELECT ID, post_date, post_content, post_title, post_excerpt, post_name, post_type FROM eak_posts WHERE post_status='publish' AND post_type IN ('post','page')"
          sshpass -p "$HG_PASS" ssh -o StrictHostKeyChecking=no \
            $HG_USER@$HG_HOST \
            "mysql -u $HG_MYSQL_USER -p'$DB_PASSWORD' $HG_MYSQL_DB -e \"$DUMP_CMD\"" \
            > public/_generated/wp-content-dump.txt 2>/dev/null || echo "WARNING: MySQL dump failed, will use WordPress API fallback in prebuild"

      - name: Generate snapshot
        working-directory: ./frontend
        run: |
          echo "Snapshot will be generated by prebuild hook (scripts/snapshot-wp-content.mjs)"
          echo "during the Next.js build step. It fetches from WordPress API or uses local.sql fallback."

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to HostGator
        working-directory: ./frontend
        env:
          HG_PASS: ${{ secrets.HG_PASS }}
        run: |
          # Deploy the built static files to HostGator via SSH
          echo "Deploying to HostGator..."
          sshpass -p "$HG_PASS" ssh -o StrictHostKeyChecking=no \
            $HG_USER@$HG_HOST \
            "cd $HG_REMOTE_PATH && \
             find . -maxdepth 1 -type f ! -name '.htaccess' -delete && \
             find . -maxdepth 1 -type d ! -name '.' ! -name '.*' -exec rm -rf {} + 2>/dev/null || true"

          # Upload new files
          rsync -avz --delete -e "sshpass -p '$HG_PASS' ssh -o StrictHostKeyChecking=no" \
            out/ $HG_USER@$HG_HOST:$HG_REMOTE_PATH/

      - name: Verify deployment
        run: |
          curl -s -o /dev/null -w "Homepage: %{http_code}\n" https://evangelisteahongankomlavi.com/
          curl -s -o /dev/null -w "Sermons: %{http_code}\n" https://evangelisteahongankomlavi.com/sermons/
          curl -s -o /dev/null -w "Snapshot: %{http_code}\n" https://evangelisteahongankomlavi.com/_generated/wp-content.json
