              - generic [ref=e46]: Qui sommes-nous
              - heading "À propos" [level=2] [ref=e47]
            - paragraph [ref=e48]: Découvrez l’histoire et la mission de l’Évangéliste Ahonga Komlavi, un serviteur appelé à conduire les âmes dans la présence de Dieu.
            - paragraph [ref=e49]: L’Évangéliste Ahonga Komlavi est un ministre de l’Évangile passionné par la transformation des vies et l’impact des communautés. Son ministère est marqué par une profonde vie de prière, un enseignement biblique solide et un appel à la sainteté. À travers le Centre de prière ESPRIT ET VIE, il accompagne des personnes de tous horizons vers une relation authentique avec Jésus-Christ.
            - paragraph [ref=e50]: "Sa mission : proclamer l’Évangile, former les disciples et impacter les communautés à travers la puissance du Saint-Esprit. Chaque rassemblement est une occasion de voir Dieu toucher les cœurs, restaurer les familles et libérer les captifs."
            - paragraph [ref=e51]: Nous croyons que la foi n’est pas seulement un mot, mais une puissance qui transforme les situations, guérit les blessures et redonne l’espoir. Rejoignez-nous pour vivre cette expérience.
